server {
    listen 80;
    server_name cv-builder.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cv-builder.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/cv-builder.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv-builder.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://api:3000;
        
        # --- 3 DÒNG BẮT BUỘC CHO WEBSOCKET / SOCKET.IO ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # --------------------------------------------------

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # (Tùy chọn) Chống Nginx tự động ngắt kết nối WebSocket nếu im lặng quá 60s
        proxy_read_timeout 86400;
    }
}