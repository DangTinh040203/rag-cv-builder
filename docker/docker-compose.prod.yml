version: '3.8'

services:
  # Backend NestJS
  api:
    image: asia-southeast1-docker.pkg.dev/project-bd8e23f4-e7fc-43d5-99e/cv-builder-repo/rag-cv-builder:latest
    container_name: rag-cv-builder
    restart: always
    env_file: .env
    depends_on:
      - redis
    networks:
      - cv-builder-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cv-builder-redis
    restart: always
    command: redis-server --appendonly yes
    networks:
      - cv-builder-network

  nginx:
    image: nginx:alpine
    container_name: cv-builder-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - cv-builder-network

networks:
  cv-builder-network:
    name: cv-builder-network
    driver: bridge